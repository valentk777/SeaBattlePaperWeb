name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (leave empty to use GitVersion semVer)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  get-version:
    name: Get version
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.x"

      - name: GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      - name: Decide image tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ steps.gitversion.outputs.semVer }}" >> $GITHUB_OUTPUT
          fi

      - name: Print deploying version
        run: echo "${{ steps.meta.outputs.tag }}"

  build-app:
    name: Build and push app image
    runs-on: ubuntu-latest
    needs: get-version

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build App Docker image (version + latest)
        env:
          IMAGE_NAME: ghcr.io/valentk777/sea-battle-paper-web
          IMAGE_TAG: ${{ needs.get-version.outputs.image_tag }}
        run: |
          docker build -t "${IMAGE_NAME}:${IMAGE_TAG}" -t "${IMAGE_NAME}:latest" .

      - name: Push App image (version + latest)
        env:
          IMAGE_NAME: ghcr.io/valentk777/sea-battle-paper-web
          IMAGE_TAG: ${{ needs.get-version.outputs.image_tag }}
        run: |
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${IMAGE_NAME}:latest"
